name: Profile metrics
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-metrics
  cancel-in-progress: false
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Generate combined dskvr and organization activity
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node .github/scripts/generate-combined-metrics.mjs > combined-metrics.svg
      - name: Generate modern trophy grid
        uses: dskvr/github-profile-trophy@397e8e55dfa7f5811f531524ac61ebb343506291
        with:
          username: dskvr
          output_path: trophies.svg
          token: ${{ secrets.METRICS_TOKEN }}
          theme: dskvr

      - name: Commit generated profile cards
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add combined-metrics.svg trophies.svg
          git diff --cached --quiet || git commit -m "Refresh generated profile cards" -m "Tested: GitHub API data fetched for dskvr and selected organizations"
          git push
      - name: Generate aggregate Metrics image
        uses: dskvr/metrics@d52615462a93f368520159f6c381649306312c1c
        with:
          use_prebuilt_image: no
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          committer_branch: gh-pages
          committer_message: "Refresh personal GitHub metrics"
          user: dskvr
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories: 1000
          repositories_batch: 25
          repositories_forks: yes
          repositories_affiliations: owner, organization_member
          repositories_included: dskvr, sandwichfarm, napplet, kehto
          repositories_maintained_forks: sandwichfarm/nsyte
          config_timezone: Europe/Budapest
          config_padding: 16
          plugins_errors_fatal: yes
          plugin_lines: yes
          plugin_lines_sections: base, repositories, history
          plugin_lines_history_limit: 0
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
